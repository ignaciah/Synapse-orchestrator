version: '3.8'
services:
  mcp-server:
    build:
      context: .
      dockerfile: Dockerfile.mcp
    ports:
      - "8001:8001"
  
  a2a-orchestrator:
    build:
      context: .
      dockerfile: Dockerfile.orchestrator
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}   # 👈 Pass from your shell
    depends_on:
      - mcp-server
  
  pharmacy-agent:
    build:
      context: .
      dockerfile: Dockerfile.pharmacy
    ports:
      - "8002:8002"
  
  scheduling-agent:
    build:
      context: .
      dockerfile: Dockerfile.scheduling
    ports:
      - "8003:8003"


